<!-- 5.	Write a JavaScript function to add rows to a table. -->

<!DOCTYPE html>
<html>
<head>
  <meta charset=utf-8 />
  <title>Insert row in a table</title>
</head>
<body>
  <table id="sampleTable" border="1">
    <tr>
      <td>Row1 cell1</td>
      <td>Row1 cell2</td>
    </tr>
    <tr>
      <td>Row2 cell1</td>
      <td>Row2 cell2</td>
    </tr>
  </table>
  <br>
  <input type="button" onclick="insertRow()" value="Insert row"> 
  <script>
    function insertRow(){
        let table = document.getElementById("sampleTable");
        let myNewRow = document.createElement("tr");
        let rowCount = table.querySelectorAll("tr").length
        let tableCellOne = document.createElement("td");
        tableCellOne.textContent =  `Row${rowCount +1} cell1`;
        let tableCellTwo = document.createElement("td");
        tableCellTwo.textContent =  `Row${rowCount +1} cell2`;
        myNewRow.appendChild(tableCellOne);
        myNewRow.appendChild(tableCellTwo);
        table.appendChild(myNewRow);
        



    }
  </script> 
</body>
</html>
