<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="colorToChange">Background color will be changed</p>
    <button onclick="restyle()">Change the color from here</button>
    <script>
        function restyle() {
            const myParagraph = document.getElementById("colorToChange")
            myParagraph.style.backgroundColor = "blue"
        }
    </script>
    
    
</body>
</html>
