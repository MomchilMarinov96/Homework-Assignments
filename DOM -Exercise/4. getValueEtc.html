<!-- 4.	Write a JavaScript function to get the value of the href, hreflang, rel, 
 target, and type attributes of the specified link. -->
<!DOCTYPE html>
<html>
<head>
  <meta charset=utf-8 />
</head>
<body>
  <p>
    <a id="someId" type="text/html" hreflang="bg-bg" rel="nofollow" target="_blank" href="#">resources</a>
  </p>
  <button onclick="getAttributes()">Click here to get attributes value</button>
  <script>
    function getAttributes() {
        const link = document.getElementById("someId");
        const href = link.getAttribute("href")
        const hreflang = link.getAttribute("hreflang")
        const rel = link.getAttribute("rel")
        const type = link.getAttribute("type")
        const target = link.getAttribute("target")
        console.log(href, type, href, rel, target)
    }
  </script>
</body>
</html>
